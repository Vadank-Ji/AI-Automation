---

- name: AI Infrastructure Auto Updater
  hosts: ai_servers
  gather_facts: false

  vars:
    project_dir: "{{ playbook_dir }}/.."
    scripts_dir: "{{ project_dir }}/scripts"
    config_path: "{{ project_dir }}/config/app_config.yml"
    backups_dir: "{{ project_dir }}/config/backups"

  tasks:
    - name: Check current AI service health with Groq
      ansible.builtin.command:
        cmd: python3 ai_service.py --health
        chdir: "{{ scripts_dir }}"
      register: initial_health
      changed_when: false
      failed_when: false

    - name: Stop deployment if current service is unhealthy
      ansible.builtin.fail:
        msg: "Current AI service is unhealthy: {{ initial_health.stdout }}"
      when: initial_health.rc != 0

    - name: Check for latest approved AI model
      ansible.builtin.command:
        cmd: python3 model_checker.py
        chdir: "{{ scripts_dir }}"
      register: model_checker
      changed_when: false

    - name: Parse model checker result
      ansible.builtin.set_fact:
        model_info: "{{ model_checker.stdout | from_json }}"

    - name: Create configuration backup directory
      ansible.builtin.file:
        path: "{{ backups_dir }}"
        state: directory
        mode: "0755"
      when: model_info.update_available

    - name: Backup working AI configuration
      ansible.builtin.copy:
        src: "{{ config_path }}"
        dest: "{{ backups_dir }}/app_config_{{ model_info.current_model | regex_replace('[^A-Za-z0-9_.-]', '_') }}.yml.bak"
        remote_src: true
        mode: "0644"
      when: model_info.update_available

    - name: Replace AI model
      ansible.builtin.replace:
        path: "{{ config_path }}"
        regexp: "^model:.*$"
        replace: "model: {{ model_info.latest_model }}"
      when: model_info.update_available
      notify: Restart AI Service

    - name: Restart service after model upgrade
      ansible.builtin.meta: flush_handlers
      when: model_info.update_available

    - name: Check upgraded model with a real Groq request
      ansible.builtin.command:
        cmd: python3 ai_service.py --health
        chdir: "{{ scripts_dir }}"
      register: upgrade_health
      changed_when: false
      failed_when: false
      when: model_info.update_available

    - name: Restore last working configuration after failed upgrade
      ansible.builtin.copy:
        src: "{{ backups_dir }}/app_config_{{ model_info.current_model | regex_replace('[^A-Za-z0-9_.-]', '_') }}.yml.bak"
        dest: "{{ config_path }}"
        mode: "0644"
      when:
        - model_info.update_available
        - upgrade_health.rc != 0
      notify: Restart AI Service

    - name: Restart service after rollback
      ansible.builtin.meta: flush_handlers
      when:
        - model_info.update_available
        - upgrade_health.rc != 0

    - name: Verify rollback model with a real Groq request
      ansible.builtin.command:
        cmd: python3 ai_service.py --health
        chdir: "{{ scripts_dir }}"
      register: rollback_health
      changed_when: false
      failed_when: false
      when:
        - model_info.update_available
        - upgrade_health.rc != 0

    - name: Fail only when the rollback health check also fails
      ansible.builtin.fail:
        msg: >-
          Upgrade to {{ model_info.latest_model }} failed and rollback to
          {{ model_info.current_model }} also failed. Upgrade result:
          {{ upgrade_health.stdout }}. Rollback result: {{ rollback_health.stdout }}
      when:
        - model_info.update_available
        - upgrade_health.rc != 0
        - rollback_health.rc != 0

    - name: Report successful rollback
      ansible.builtin.debug:
        msg: >-
          Upgrade to {{ model_info.latest_model }} failed, but configuration
          was restored to {{ model_info.current_model }} and passed health.
      when:
        - model_info.update_available
        - upgrade_health.rc != 0
        - rollback_health.rc == 0

  handlers:
    - name: Restart AI Service
      ansible.builtin.command:
        cmd: ./restart_service.sh
        chdir: "{{ scripts_dir }}"
